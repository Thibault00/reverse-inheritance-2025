version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: trading-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradingbot
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d tradingbot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: