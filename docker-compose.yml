# Full Stack Solana Trading Bot
# Frontend: Next.js, Backend: Python FastAPI, Database: PostgreSQL

services:
  # Frontend - Next.js Dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: trading-bot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - trading-bot-network

  # Backend - Python FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-bot-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://dev:devpassword@postgres:5432/tradingbot
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trading-bot-network

  # Database - PostgreSQL 16
  postgres:
    image: postgres:16
    container_name: trading-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradingbot
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d tradingbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-bot-network

volumes:
  postgres_data:

networks:
  trading-bot-network:
    driver: bridge